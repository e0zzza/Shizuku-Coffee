<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Successful – Shizuku Coffee</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="products.js"></script>
    <script src="quickview.js"></script>
</head>

<body>
    <img src="tree.png" class="sakura-tree-top" alt="">
<nav class="glass-nav">
  <div class="nav-left">
    <a href="index.html"><img src="logo.png" class="nav-logo" alt=""></a>
  </div>

  <div class="nav-center">
    <div class="nav-search">
      <input type="text" id="searchInput" placeholder="Search coffee..." />
      <span class="search-icon">🔍</span>
    </div>
  </div>

  <div class="nav-right">
    <a href="basket.html"><img src="cart.png" alt=""></a>
    <a href="wishlist.html"><img src="love.png" alt=""></a>
    <a href="profile.html"><img src="profile-icon.png" alt=""></a>
  </div>
</nav>

<div id="languageToggleContainer">
    <button id="langToggle" class="sakura-btn">🇯🇵</button>
  </div>

  <div class="success-wrapper" style="display: block; padding-top: 140px;">
    <div class="checkout-progress">
        <div class="progress-line"><div class="progress-line-fill" style="width: 100%;"></div></div>
        <div class="progress-step completed"><div class="step-circle">1</div><div class="step-label">Cart</div></div>
        <div class="progress-step completed"><div class="step-circle">2</div><div class="step-label">Shipping</div></div>
        <div class="progress-step completed"><div class="step-circle">3</div><div class="step-label">Payment</div></div>
        <div class="progress-step active"><div class="step-circle">4</div><div class="step-label">Success</div></div>
    </div>

    <div style="display: flex; justify-content: center; align-items: center;">
    <div class="success-card">
        <div class="success-icon" aria-hidden="true"></div>

        <h1 class="success-title" id="succTitle">Order Placed Successfully</h1>
        <p class="success-text" id="succText">Thank you for your purchase. Your order is now being prepared.</p>

        <div class="order-summary-details" style="margin-bottom: 20px; border-top: 1px solid rgba(255, 182, 193, 0.3); padding-top: 20px;">
            <p style="display: flex; justify-content: space-between; font-size: 14px; color: var(--sakura-brown-light);">
                <span class="label-sub">Subtotal:</span> <span id="successSubtotal">€0.00</span>
            </p>
            <p id="discountRow" style="display: none; justify-content: space-between; font-size: 14px; color: var(--sakura-pink-main);">
                <span class="label-disc">Discount:</span> <span id="successDiscount">-€0.00</span>
            </p>
            <p id="rankDiscountRow" style="display: none; justify-content: space-between; font-size: 14px; color: var(--sakura-pink-main);">
                <span class="label-rank-disc">Rank Discount:</span> <span id="successRankDiscount">-€0.00</span>
            </p>
            <p id="voucherDiscountRow" style="display: none; justify-content: space-between; font-size: 14px; color: var(--sakura-pink-main);">
                <span class="label-voucher-disc">Voucher:</span> <span id="successVoucherDiscount">-€0.00</span>
            </p>
            <p id="giftCardDiscountRow" style="display: none; justify-content: space-between; font-size: 14px; color: #8b6914;">
                <span class="label-gift-disc">Gift Card:</span> <span id="successGiftCardDiscount">-€0.00</span>
            </p>
            <p style="display: flex; justify-content: space-between; font-size: 14px; color: var(--sakura-brown-light);">
                <span class="label-ship">Shipping:</span> <span id="successShipping">€0.00</span>
            </p>
            <p style="display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; color: var(--sakura-brown-dark); border-top: 1px solid rgba(255, 182, 193, 0.3); padding-top: 10px; margin-top: 10px;">
                <span class="label-total">Order Total:</span> <span id="successTotal">€0.00</span>
            </p>
        </div>

        <button class="sakura-btn btn-history" onclick="window.location.href='profile.html'">
            View Order History
        </button>

        <button class="sakura-btn secondary btn-cont" onclick="window.location.href='index.html'">
            Continue Shopping
        </button>
    </div>
</div>

<script>
const translations = {
    en: {
        title: "Order Placed Successfully",
        text: "Thank you for your purchase. Your order is now being prepared.",
        sub: "Subtotal:",
        disc: "Discount:",
        ship: "Shipping:",
        total: "Order Total:",
        history: "View Order History",
        cont: "Continue Shopping",
        searchPlh: "Search coffee..."
    },
    jp: {
        title: "注文が完了しました",
        text: "ご購入ありがとうございます。商品の発送準備を進めております。",
        sub: "小計:",
        disc: "割引:",
        ship: "配送料:",
        total: "合計額:",
        history: "注文履歴を見る",
        cont: "買い物を続ける",
        searchPlh: "コーヒーを検索..."
    }
};

let currentLang = localStorage.getItem("language") || "en";
const searchInput = document.getElementById("searchInput");
const searchIcon = document.querySelector(".search-icon");

function triggerSearch() {
    window.location.href = "index.html?search=" + encodeURIComponent(searchInput.value);
}

function updateLanguage() {
    const lang = currentLang;
    const t = translations[lang];

    if (lang === 'jp') {
        document.body.classList.add('lang-jp');
    } else {
        document.body.classList.remove('lang-jp');
    }

    document.getElementById("langToggle").innerText = lang === "en" ? "🇯🇵" : "🇺🇸";
    document.getElementById("succTitle").innerText = t.title;
    document.getElementById("succText").innerText = t.text;
    document.querySelector(".label-sub").innerText = t.sub;
    document.querySelector(".label-disc").innerText = t.disc;
    document.querySelector(".label-rank-disc").innerText = lang === 'jp' ? 'ランク割引:' : 'Rank Discount:';
    document.querySelector(".label-voucher-disc").innerText = lang === 'jp' ? 'クーポン:' : 'Voucher:';
    document.querySelector(".label-gift-disc").innerText = lang === 'jp' ? 'ギフトカード:' : 'Gift Card:';
    document.querySelector(".label-ship").innerText = t.ship;
    document.querySelector(".label-total").innerText = t.total;
    document.querySelector(".btn-history").innerText = t.history;
    document.querySelector(".btn-cont").innerText = t.cont;
    document.getElementById("searchInput").placeholder = t.searchPlh;
}

function populateOrderSummary() {
    const user = JSON.parse(localStorage.getItem("loggedInUser") || "null");
    const orders = JSON.parse(localStorage.getItem("orders") || "[]");
    if (!orders.length) return;

    const latestOrderId = sessionStorage.getItem("latestOrderId");
    let lastOrder = null;

    if (latestOrderId) {
        lastOrder = orders.find(o => o.orderId === latestOrderId) || null;
    }

    if (!lastOrder && user) {
        const userOrders = orders.filter(o => o.userEmail === user.email);
        if (userOrders.length) {
            lastOrder = userOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
        }
    }

    if (!lastOrder) {
        lastOrder = orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0))[0];
    }

    if (!lastOrder) return;

    document.getElementById("successSubtotal").innerText = formatPrice(lastOrder.subtotal);
    document.getElementById("successShipping").innerText = formatPrice(lastOrder.shippingCost);
    document.getElementById("successTotal").innerText = formatPrice(lastOrder.total);
    
    if (lastOrder.discount > 0) {
        document.getElementById("discountRow").style.display = "flex";
        document.getElementById("successDiscount").innerText = "-" + formatPrice(lastOrder.discount);
    }
    if (lastOrder.rankDiscount > 0) {
        document.getElementById("rankDiscountRow").style.display = "flex";
        document.getElementById("successRankDiscount").innerText = "-" + formatPrice(lastOrder.rankDiscount);
    }
    if (lastOrder.voucherDiscount > 0) {
        document.getElementById("voucherDiscountRow").style.display = "flex";
        document.getElementById("successVoucherDiscount").innerText = "-" + formatPrice(lastOrder.voucherDiscount);
    }
    if (lastOrder.giftCardDiscount > 0) {
        document.getElementById("giftCardDiscountRow").style.display = "flex";
        document.getElementById("successGiftCardDiscount").innerText = "-" + formatPrice(lastOrder.giftCardDiscount);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    updateLanguage();
    populateOrderSummary();
    if (searchInput) searchInput.addEventListener("keypress", (e) => { if (e.key === "Enter") triggerSearch(); });
    if (searchIcon) searchIcon.addEventListener("click", triggerSearch);
});

document.getElementById("langToggle").addEventListener("click", () => {
    currentLang = currentLang === "en" ? "jp" : "en";
    localStorage.setItem("language", currentLang);
    updateLanguage();
});
</script>
</body>
</html>

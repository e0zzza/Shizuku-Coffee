function updateLanguageToggle() {
    const toggle = document.getElementById("langToggle");
    if (!toggle) return;
    const targetLang = currentLang === "en" ? "jp" : "en";
    toggle.innerHTML = flagSvgs[targetLang];
    toggle.title = targetLang === "jp" ? "日本語に切り替え" : "Switch to English";
    toggle.setAttribute("aria-label", toggle.title);
}

function applyMobileGridDensity(value = localStorage.getItem("mobileGridDensity") || "1") {
    const normalized = ["1", "2", "4"].includes(String(value)) ? String(value) : "1";
    grid.classList.remove("mobile-density-1", "mobile-density-2", "mobile-density-4");
    grid.classList.add(`mobile-density-${normalized}`);
    densityButtons.forEach(btn => {
        const isActive = btn.dataset.density === normalized;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
    });
    localStorage.setItem("mobileGridDensity", normalized);
}

function renderShop() {
    const lang = currentLang;
    const t = translations[lang];

    const user = (typeof QuickView !== 'undefined') ? QuickView.getLoggedInUser() : null;
    const lifetime = (typeof QuickView !== 'undefined') ? QuickView.getLifetimePoints(user) : 0;
    const tier = (typeof QuickView !== 'undefined') ? QuickView.getCurrentTier(lifetime) : { name: "Sprout" };

    if (lang === 'jp') {
        document.body.classList.add('lang-jp');
    } else {
        document.body.classList.remove('lang-jp');
    }

    updateLanguageToggle();
    document.getElementById("promoTextStart").innerText = t.promo;
    document.getElementById("promoTextEnd").innerText = t.promoEnd;

    document.querySelector(".shop-title").innerText = t.title;
    document.querySelector(".shop-subtitle").innerText = t.subtitle;
    document.getElementById("searchInput").placeholder = t.searchPlh;
    if (densityLabel) densityLabel.innerText = lang === "jp" ? "表示" : "View";

    document.querySelectorAll(".step-label").forEach((el, i) => {
        if (t.progressSteps[i]) el.innerText = t.progressSteps[i];
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        const filter = btn.dataset.filter;
        if(filter === 'all') btn.innerText = t.filterAll;
        if(filter === 'light') btn.innerText = t.filterLight;
        if(filter === 'medium') btn.innerText = t.filterMedium;
        if(filter === 'dark') btn.innerText = t.filterDark;
        if(filter === 'flavored') btn.innerText = t.filterFlavored;
        if(filter === 'accessory') btn.innerText = t.filterAccessory;
    });

    const sortSelect = document.getElementById("sortSelect");
    sortSelect.options[0].text = t.sortDefault;
    sortSelect.options[1].text = t.sortLow;
    sortSelect.options[2].text = t.sortHigh;
    sortSelect.options[3].text = t.sortPopular;
    sortSelect.options[4].text = t.sortRoast;
    sortSelect.options[5].text = t.sortRating;

    const pf = document.getElementById("priceFilter");
    t.priceRanges.forEach((text, i) => {
        if (pf.options[i]) pf.options[i].text = text;
    });

    const rf = document.getElementById("ratingFilter");
    t.ratingOptions.forEach((text, i) => {
        if (rf.options[i]) rf.options[i].text = text;
    });

    if (typeof QuickView !== 'undefined') QuickView.updateFooterUI();

    document.getElementById("menuHome").innerText = t.menuHome;
    document.getElementById("menuProfile").innerText = t.menuProfile;
    document.getElementById("menuWishlist").innerText = t.menuWishlist;
    document.getElementById("menuCart").innerText = t.menuCart;
    document.getElementById("menuAbout").innerText = "🌸 " + t.fAbout;
    document.getElementById("menuContact").innerText = "☕ " + t.fContact;
    document.getElementById("mobileMenuHint").innerText = lang === "jp" ? "メニュー" : "Menu";
    document.getElementById("menuShopLabel").innerText = lang === "jp" ? "ショップ" : "Shop";
    document.getElementById("menuHelpLabel").innerText = lang === "jp" ? "ヘルプ" : "Help";

    if (document.getElementById("utilTrack")) document.getElementById("utilTrack").title = t.utilTrack;
    if (document.getElementById("utilGuide")) document.getElementById("utilGuide").title = t.utilGuide;
    if (document.getElementById("utilPolicy")) document.getElementById("utilPolicy").title = t.utilPolicy;

    grid.innerHTML = SHIZUKU_PRODUCTS.map(p => {
        const avgRating = calculateAverageRating(p.title);
        const reviewCount = getReviewsForProduct(p.title).length + QuickView.reviewsPool.filter(r => r.productTitle === p.title).length;

        const isSeasonal = p.title.includes("Sakura") || p.roast === "flavored" || p.title.includes("桜");
        const isAccessory = p.roast === 'accessory';

        let disc = 0;
        if (tier.name === "Sakura") {
            disc = isAccessory ? 20 : 10;
        } else {
            if (isAccessory && tier.name === "Petal") disc = 10;
            else if (isSeasonal && tier.name !== "Sprout") disc = 5;
        }

        const badge = disc > 0 ? ` <span class="badge bg-success ms-1" style="font-size: 10px; vertical-align: middle;">${disc}% OFF</span>` : '';
        const originLabel = p.origin ? (lang === 'jp' ? (p.origin_jp || p.origin) : p.origin) : '';
        const originBadge = p.origin ? `<span class="origin-badge" data-origin="${p.origin}" onclick="event.stopPropagation(); QuickView.openOriginMap('${p.origin}')" title="${originLabel}">📍 ${originLabel}</span>` : '';
        const priceHtml = disc > 0
            ? `<div class="d-flex flex-column"><span class="text-decoration-line-through opacity-50 me-2" style="font-size: 0.75em; line-height: 1;">${formatPrice(p.price)}</span><span class="price" style="color: var(--sakura-pink-dark);">${formatPrice(parseFloat(p.price) * (1 - disc/100))}</span></div>`
            : `<span class="price">${formatPrice(p.price)}</span>`;

        return `
        <div class="product-card" data-title="${p.title}" data-roast="${p.roast}" data-price="${p.price}" data-popular="${p.popular}" data-rating="${avgRating}">
            <span class="wishlist-heart" data-title="${p.title}">♡</span>
            <img src="${p.img}" alt="${p.title}">
            <h3>${lang === 'jp' ? (p.title_jp || p.title) : p.title}${badge}</h3>
            <p class="desc">${lang === 'jp' ? (p.tagline_jp || p.tagline) : p.tagline}${originBadge}</p>
            <div class="mb-2">
                <div class="product-rating-summary">
                    ${renderStars(avgRating)}
                    <span style="font-size: 11px; opacity: 0.8;">(${reviewCount})</span>
                </div>
            </div>
            <div class="price-row">
                ${priceHtml}
                <button class="add-btn" type="button" data-title="${p.title}">${translations[lang].cartBtn}</button>
            </div>
        </div>
    `; }).join("");
    applyMobileGridDensity();
    attachEventListeners();
    applyAllFilters();
}

function attachEventListeners() {
    const cards = document.querySelectorAll(".product-card");
    const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");

    cards.forEach(card => {
        const title = card.dataset.title;
        const product = SHIZUKU_PRODUCTS.find(p => p.title === title);

        card.addEventListener("click", (e) => {
            if (e.target.closest(".add-btn") || e.target.closest(".wishlist-heart")) return;
            QuickView.show(product);
        });

        card.querySelector(".add-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            addToCart(product);
        });

        const heart = card.querySelector(".wishlist-heart");
        if (wishlist.some(i => i.title === title)) {
            heart.classList.add("active");
            heart.innerText = "♥";
        }
        heart.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleWishlist(product, heart);
        });
    });
}

function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const existing = cart.find(i => i.title === product.title);
    if (existing) existing.qty++;
    else cart.push({ ...product, qty: 1 });
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartBadge();
    
    const lang = currentLang;
    const productName = lang === 'jp' ? (product.title_jp || product.title) : product.title;
    const msg = `<span style="font-weight:600; color: var(--sakura-pink-main);">${productName}</span> ` + 
                (lang === 'jp' ? 'がカートに追加されました！' : 'has been added to your cart!');

    window.showSakuraToast(msg, '🛒', {
        text: lang === 'jp' ? '元に戻す' : 'Undo',
        callback: () => QuickView.undoAddToCart(product.title, 1)
    });
}

function toggleWishlist(product, heart) {
    let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
    const idx = wishlist.findIndex(i => i.title === product.title);
    if (idx > -1) {
        wishlist.splice(idx, 1);
        heart.classList.remove("active");
        heart.innerText = "♡";
    } else {
        wishlist.push(product);
        heart.classList.add("active");
        heart.innerText = "♥";
        heart.classList.add("pop");
        setTimeout(() => heart.classList.remove("pop"), 350);
    }
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
}

function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    const badge = document.getElementById("cartBadge");
    if (badge) {
        badge.innerText = count;
        badge.style.display = count > 0 ? "block" : "none";
    }
}

function applyAllFilters() {
    const roastFilter = document.querySelector(".filter-btn.active").dataset.filter;
    const priceValue = priceFilter.value;
    const ratingValue = document.getElementById("ratingFilter").value;
    const searchValue = searchInput.value.toLowerCase();
    const cards = document.querySelectorAll(".product-card");

    let visibleCount = 0;

    cards.forEach(card => {
        const productTitle = card.dataset.title;
        const roast = card.dataset.roast;
        const price = parseFloat(card.dataset.price);
        const title = card.querySelector("h3").innerText.toLowerCase();

        let show = true;
        if (roastFilter !== "all" && roast !== roastFilter) show = false;
        if (priceValue !== "all") {
            const [min, max] = priceValue.split("-").map(Number);
            if (price < min || price >= max) show = false;
        }
        if (ratingValue !== "all") {
            const avgRating = calculateAverageRating(productTitle);
            if (avgRating < parseFloat(ratingValue)) show = false;
        }
        if (!title.includes(searchValue)) show = false;
        card.style.display = show ? "block" : "none";

        if (show) visibleCount++;
    });
}

function resetFilters() {
    searchInput.value = "";
    priceFilter.value = "all";
    document.getElementById("ratingFilter").value = "all";
    filterButtons.forEach(btn => {
        btn.classList.remove("active");
        if (btn.dataset.filter === "all") btn.classList.add("active");
    });
    applyAllFilters();
}
    
filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        applyAllFilters();
    });
});

densityButtons.forEach(btn => {
    btn.addEventListener("click", () => applyMobileGridDensity(btn.dataset.density));
});
    
priceFilter.addEventListener("change", applyAllFilters);
document.getElementById("ratingFilter").addEventListener("change", applyAllFilters);

let searchTimeout;
searchInput.addEventListener("input", () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(applyAllFilters, 300);
});

searchIcon.addEventListener("click", applyAllFilters);

sortSelect.addEventListener("change", function() {
    const val = this.value;
    const cards = Array.from(document.querySelectorAll(".product-card"));
    if (val === "price-low") cards.sort((a,b) => a.dataset.price - b.dataset.price);
    else if (val === "price-high") cards.sort((a,b) => b.dataset.price - a.dataset.price);
    else if (val === "popular") cards.sort((a,b) => a.dataset.popular - b.dataset.popular);
    else if (val === "rating-high") cards.sort((a,b) => b.dataset.rating - a.dataset.rating);
    else if (val === "roast") {
        const order = { "light": 1, "medium": 2, "dark": 3, "flavored": 4 };
        cards.sort((a, b) => order[a.dataset.roast] - order[b.dataset.roast]);
    }
    grid.innerHTML = "";
    cards.forEach(c => grid.appendChild(c));
});
    
document.getElementById("langToggle").addEventListener("click", () => {
    currentLang = currentLang === "en" ? "jp" : "en";
    localStorage.setItem("language", currentLang);
    updateLanguageToggle();
    renderShop();
});

document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    if (params.has("search")) {
        searchInput.value = params.get("search");
    }

    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    const isCouponUsed = localStorage.getItem("couponApplied") === "true";
    const orders = JSON.parse(localStorage.getItem("orders") || "[]");
    const hasOrders = user && orders.some(o => o.userEmail === user.email);

    if (user && !isCouponUsed && !hasOrders) {
        document.getElementById("promoBanner").style.display = "flex";
    }

    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.add('active');
    });
    document.querySelector('.menu-close').addEventListener('click', () => {
        document.getElementById('mobileMenu').classList.remove('active');
    });
    document.querySelectorAll('.menu-links *').forEach(link => {
        link.addEventListener('click', () => document.getElementById('mobileMenu').classList.remove('active'));
    });

    window.addEventListener('click', (e) => {
        const menu = document.getElementById('mobileMenu');
        const toggle = document.getElementById('menuToggle');
        if (menu.classList.contains('active') && !menu.contains(e.target) && !toggle.contains(e.target)) {
            menu.classList.remove('active');
        }
    });

    renderShop();
    updateCartBadge();
});
    </script>

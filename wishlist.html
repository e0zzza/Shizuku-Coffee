<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Shizuku Coffee</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="products.js"></script>
<script src="quickview.js"></script>
</head>

<body>
<img src="tree.png" class="sakura-tree-top" alt="">
<nav class="glass-nav">
  <div class="nav-left">
    <a href="index.html"><img src="logo.png" class="nav-logo" alt=""></a>
  </div>

  <div class="nav-center">
    <div class="nav-search">
      <input type="text" id="searchInput" placeholder="Search coffee..." />
      <span class="search-icon">🔍</span>
    </div>
  </div>

  <div class="nav-right">
    <a href="basket.html">
        <img src="cart.png" alt="">
        <span id="cartBadge" class="cart-badge">0</span>
    </a>
    <a href="wishlist.html"><img src="love.png" alt=""></a>
    <a href="profile.html"><img src="profile-icon.png" alt=""></a>
  </div>
</nav>

<div id="languageToggleContainer">
    <button id="langToggle" class="sakura-btn">🇯🇵</button>
</div>
<br>
<br>

<h1 class="wishlist-title" id="wishTitle">Your Wishlist</h1>

<div id="wishlistContainer" class="wishlist-grid"></div>

<h2 class="wishlist-title" id="recommendTitle" style="margin-top: 60px; font-size: 28px;">Recommended for you</h2>
<div id="recommendationsContainer" class="wishlist-grid"></div>

<script>
const searchInput = document.getElementById("searchInput");
const searchIcon = document.querySelector(".search-icon");

const translations = {
    en: {
        title: "Your Wishlist",
        recommend: "Recommended for you",
        added: "has been added to your cart!",
        searchPlh: "Search coffee..."
    },
    jp: {
        title: "ウィッシュリスト",
        recommend: "あなたへのおすすめ",
        added: "がカートに追加されました！",
        searchPlh: "コーヒーを検索..."
    }
};

function triggerSearch() {
    window.location.href = "index.html?search=" + encodeURIComponent(searchInput.value);
}

function updateLangToggleButton() {
    const langToggleBtn = document.getElementById("langToggle");
    const currentLang = localStorage.getItem("language") || "en";
    const t = translations[currentLang];

    if (currentLang === 'jp') {
        document.body.classList.add('lang-jp');
    } else {
        document.body.classList.remove('lang-jp');
    }

    if (langToggleBtn) {
        langToggleBtn.innerText = currentLang === "en" ? "🇯🇵" : "🇬🇧";
    }
    document.getElementById("wishTitle").innerText = t.title;
    document.getElementById("recommendTitle").innerText = t.recommend;
    document.getElementById("toastAddedMsg").innerText = t.added;
    document.getElementById("searchInput").placeholder = t.searchPlh;
}

searchInput.addEventListener("keypress", (e) => { if (e.key === "Enter") triggerSearch(); });
searchIcon.addEventListener("click", triggerSearch);

document.getElementById("langToggle").addEventListener("click", () => {
    let currentLang = localStorage.getItem("language") || "en";
    currentLang = currentLang === "en" ? "jp" : "en";
    localStorage.setItem("language", currentLang);
    updateLangToggleButton();
    if (typeof renderWishlist === 'function') renderWishlist();
});
updateLangToggleButton();
</script>
<script src="wishlist.js"></script>

</body>
</html>

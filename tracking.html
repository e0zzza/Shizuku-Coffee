<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Order – Shizuku Coffee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="products.js"></script>
    <script src="quickview.js"></script>
</head>
<body>
    <img src="tree.png" class="sakura-tree-top" alt="">
    <nav class="glass-nav">
        <div class="nav-left"><a href="index.html"><img src="logo.png" class="nav-logo" alt=""></a></div>
        <div class="nav-center">
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search coffee..." />
                <span class="search-icon">🔍</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="basket.html"><img src="cart.png" alt=""><span id="cartBadge" class="cart-badge">0</span></a>
            <a href="wishlist.html" class="nav-hide-mobile"><img src="love.png" alt=""></a>
            <a href="profile.html" class="nav-hide-mobile"><img src="profile-icon.png" alt=""></a>
            <button id="menuToggle" class="hamburger-btn">☰</button>
        </div>
    </nav>

    <div id="languageToggleContainer"><button id="langToggle" class="sakura-btn">🇯🇵</button></div>

    <div class="page-wrapper" style="margin-top: 140px;">
        <h1 class="page-title">
            <span id="pageTitleText">Order Tracking</span>
            <button id="refreshBtn" class="utility-icon-btn" style="display: inline-flex; width: 38px; height: 38px; font-size: 18px; margin-left: 15px; vertical-align: middle;" title="Refresh Status">
                <svg xmlns="w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="refresh-icon">
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                  <path d="M16 3h5v5" />
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                  <path d="M8 21H3v-5" />
                </svg>
            </button>
        </h1>

        <div id="trackingContent">
            <div class="checkout-progress" style="max-width: 600px;">
                <div class="progress-line"><div class="progress-line-fill" id="trackLineFill" style="width: 0%;"></div></div>
                <div class="progress-step" id="step1"><div class="step-circle">1</div><div class="step-label">Ordered</div></div>
                <div class="progress-step" id="step2"><div class="step-circle">2</div><div class="step-label">Preparing</div></div>
                <div class="progress-step" id="step3"><div class="step-circle">3</div><div class="step-label">Shipped</div></div>
                <div class="progress-step" id="step4"><div class="step-circle">4</div><div class="step-label">Delivered</div></div>
            </div>

            <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
                <div class="d-flex justify-content-between mb-4">
                    <div>
                        <h5 id="orderIdLabel" style="font-size: 14px; margin: 0; opacity: 0.7;">ORDER ID</h5>
                        <strong id="displayOrderId" style="color: var(--sakura-brown-dark);">#000000</strong>
                    </div>
                    <div class="text-end">
                        <h5 id="statusLabel" style="font-size: 14px; margin: 0; opacity: 0.7;">ESTIMATED ARRIVAL</h5>
                        <strong id="displayArrival" style="color: var(--sakura-pink-main);">Calculating...</strong>
                    </div>
                </div>
                <div id="trackOrderItems"></div>
                <hr style="border-top: 1px solid rgba(255, 182, 193, 0.3);">
                <div class="d-flex justify-content-between align-items-center">
                    <span id="totalLabel" style="font-weight: 600;">Order Total:</span>
                    <span id="displayTotal" style="font-weight: 700; font-size: 20px; color: var(--sakura-brown-dark);">€0.00</span>
                </div>

                <div class="text-center mt-4 pt-3 border-top" id="cancelArea" style="display: none;">
                    <button id="cancelOrderBtn" class="sakura-btn secondary w-100 mb-2">Cancel Order</button>
                    <p class="small opacity-50 mb-0" style="font-size: 11px;">Orders can be cancelled within 1 hour of placement.</p>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="cancelConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-header border-0">
            <h5 class="modal-title w-100" id="cancelModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="cancelModalBody"></div>
          <div class="modal-footer border-0 justify-content-center">
            <button type="button" class="sakura-btn secondary" data-bs-dismiss="modal" id="keepOrderBtn"></button>
            <button type="button" class="sakura-btn" id="confirmCancelBtn"></button>
          </div>
        </div>
      </div>
    </div>
</body>
    <script>
    const translations = {
        en: {
            pageTitle: "Order Tracking",
            idLabel: "ORDER ID",
            statusLabel: "ESTIMATED ARRIVAL",
            totalLabel: "Order Total:",
            steps: ["Ordered", "Preparing", "Shipped", "Delivered"],
            arrival: "2-3 Business Days",
            noOrders: "No active orders found. Redirecting...",
            cancelBtn: "Cancel Order",
            delivered: "Delivered!",
            estArrival: "ESTIMATED ARRIVAL",
            estimatedDeliveryRange: "Estimated Delivery: {start} - {end}",
            cancelTitle: "Cancel Order",
            keepOrder: "Keep Order",
            writeReview: "Write a Review",
            orderCompleted: "Order Completed!",
            statusCompleted: "ORDER STATUS",
            cancelConfirm: "Are you sure you want to cancel this order? ",
            cancelSuccess: "Order cancelled successfully.",
            footerDesc: "Crafting the perfect cup of coffee inspired by the seasons of Japan. Every bean tells a story of tradition and quality.",
            fLinks: "Quick Links", fVisit: "Visit Us", fAbout: "About Us", fContact: "Contact Support",
            aboutT: "Our Story", aboutB:"Founded in the heart of Kyoto, Shizuku Coffee (雫コーヒー) was born from a passion for specialty beans and the transient beauty of cherry blossoms.",
            contactT: "Get in Touch ☕", contactB: "Email: hello@shizuku.coffee<br>Phone: +81 03-1234-5678",
            guideT: "Brewing the Perfect Sakura Cup ☕",
            guideB: "Enjoy our specialty beans at home with this simple guide:<br><br><ul><li><b>Grind:</b> Medium-Coarse (like sea salt).</li><li><b>Water:</b> 92°C (approx. 200°F).</li><li><b>Ratio:</b> 15g coffee to 250ml water.</li><li><b>Technique:</b> Pour 30ml to 'bloom' for 30s, then pour slowly in circles.</li></ul><p><i>Tip: Serve in a clear glass to enjoy the light, tea-like color!</i></p>",
            policyT: "Returns & Exchanges ",
            policyB: "We want you to love your Shizuku Coffee! If you are not satisfied with your purchase, you can return unopened items within 30 days of delivery. For fresh roasted beans, please contact us within 7 days if there is a quality issue.",
            fHoursWeek: "Mon - Fri: 8am - 7pm", fHoursEnd: "Sat - Sun: 9am - 6pm",
            fNewsletter: "Join Our Newsletter", fNewsletterDesc: "Subscribe for updates!",
            fNewsletterPlh: "Your email...", fNewsletterBtn: "Join"
        },
        jp: {
            pageTitle: "注文追跡",
            idLabel: "注文番号",
            statusLabel: "到着予定日",
            totalLabel: "合計金額:",
            steps: ["注文済み", "準備中", "発送済み", "配送完了"],
            arrival: "2〜3営業日以内",
            noOrders: "注文が見つかりません。移動します...",
            cancelBtn: "注文をキャンセル",
            delivered: "配達完了！",
            estArrival: "到着予定時刻",
            estimatedDeliveryRange: "配達予定日: {start} - {end}",
            cancelTitle: "注文のキャンセル",
            keepOrder: "注文を維持する",
            writeReview: "レビューを書く",
            orderCompleted: "ご注文が完了しました！",
            statusCompleted: "注文状況",
            cancelConfirm: "この注文をキャンセルしてもよろしいですか？ ",
            cancelSuccess: "注文がキャンセルされました。",
            footerDesc: "日本の四季にインスパイアされた、最高の一杯をお届けします。",
            fLinks: "クイックリンク", fVisit: "店舗案内", fAbout: "私たちについて", fContact: "お問い合わせ",
            aboutT: "私たちの物語", aboutB: "京都の中心で生まれた雫コーヒー...",
            contactT: "お問い合わせ ☕",
            contactB: "メール: hello@shizuku.coffee<br>電話: +81 03-1234-5678",
            guideT: "究極の桜コーヒーの淹れ方 ☕",
            guideB: "このシンプルなガイドで、特別な豆を自宅で楽しんでください:<br><br><ul><li><b>挽き方：</b>中粗挽き（海塩のように）</li><li><b>水：</b>92°C（約200°F）</li><li><b>比率：</b>15gのコーヒーに対して250mlの水</li><li><b>テクニック：</b>30mlを注いで30秒間「ブルーミング」させ、その後ゆっくりと円を描くように注ぎます。</li></ul><p><i>ヒント：透明なグラスで提供して、軽やかでお茶のような色合いを楽しんでください！</i></p>",
            policyT: "返品・交換について",
            policyB: "雫コーヒーをご愛用いただきありがとうございます。万が一商品にご満足いただけない場合、未開封の商品に限りお届けから30日以内であれば返品を承ります。焙煎豆などの生鮮品については、品質に問題がある場合、お届けから7日以内にご連絡ください。",
            fHoursWeek: "月 - 金：8:00 - 19:00", fHoursEnd: "土 - 日：9:00 - 18:00",
            fNewsletter: "ニュースレター登録", fNewsletterDesc: "最新情報をお届けします！",
            fNewsletterPlh: "メールアドレス...", fNewsletterBtn: "登録"
        }
    };

    function renderTracking() {
        const lang = localStorage.getItem("language") || "en";
        const t = translations[lang];
        const user = JSON.parse(localStorage.getItem("loggedInUser"));
        const allOrders = JSON.parse(localStorage.getItem("orders") || "[]");
        const userOrders = user ? allOrders.filter(o => o.userEmail === user.email) : [];

        const urlParams = new URLSearchParams(window.location.search);
        const targetOrderId = urlParams.get('id');
        
        const latestOrder = targetOrderId 
            ? userOrders.find(o => o.orderId === targetOrderId)
            : userOrders.sort((a, b) => b.timestamp - a.timestamp)[0];
            
        const cancelModalEl = document.getElementById('cancelConfirmModal');
        const cancelModal = bootstrap.Modal.getOrCreateInstance(cancelModalEl);

        if (!user || !latestOrder) {
            window.showSakuraToast(t.noOrders, '📦');
            setTimeout(() => window.location.href = "profile.html", 2000);
            return;
        }

        document.body.classList.toggle('lang-jp', lang === 'jp');
        document.getElementById("langToggle").innerText = lang === "en" ? "🇯🇵" : "🇬🇧";
        document.getElementById("pageTitleText").innerText = t.pageTitle;
        document.getElementById("orderIdLabel").innerText = t.idLabel;
        document.getElementById("totalLabel").innerText = t.totalLabel;
        document.getElementById("displayOrderId").innerText = "#" + latestOrder.orderId;
        document.getElementById("displayTotal").innerText = formatPrice(latestOrder.total);
        
        const currentStatus = getSimulatedStatus(latestOrder.timestamp);
        const stageMap = { 
            "Paid & Preparing": 1, 
            "Payment Confirmed": 1, 
            "Preparing": 2, 
            "Shipped": 3, 
            "Delivered": 4 
        };
        const stage = stageMap[currentStatus] || 1;
    
        const arrivalEl = document.getElementById("displayArrival");
        const statusLabelEl = document.getElementById("statusLabel");

        if (stage === 4) {
            statusLabelEl.innerText = t.statusCompleted;
            arrivalEl.innerText = t.delivered;
        } else {
            statusLabelEl.innerText = t.estArrival;
    
            const orderDate = new Date(latestOrder.timestamp);
            const estStart = new Date(orderDate.getTime() + (2 * 24 * 60 * 60 * 1000)); 
            const estEnd = new Date(orderDate.getTime() + (4 * 24 * 60 * 60 * 1000));   
    
            const options = { month: 'short', day: 'numeric' };
            const formattedStart = estStart.toLocaleDateString(lang === 'jp' ? 'ja-JP' : 'en-US', options);
            const formattedEnd = estEnd.toLocaleDateString(lang === 'jp' ? 'ja-JP' : 'en-US', options);

            arrivalEl.innerText = t.estimatedDeliveryRange
                .replace('{start}', formattedStart)
                .replace('{end}', formattedEnd);
        }

        const fillWidth = stage === 1 ? '0%' : stage === 2 ? '33%' : stage === 3 ? '66%' : '100%';
        document.getElementById("trackLineFill").style.width = fillWidth;

        const timeElapsed = Date.now() - latestOrder.timestamp;
        const isWithinOneHour = timeElapsed < 3600000; 

        const cancelBtn = document.getElementById("cancelOrderBtn");
        const cancelArea = document.getElementById("cancelArea");
        if (cancelBtn && cancelArea) {
            cancelBtn.innerText = t.cancelBtn;
            cancelArea.style.display = isWithinOneHour ? "block" : "none";
        }

        t.steps.forEach((label, i) => {
            const stepNum = i + 1;
            const el = document.getElementById("step" + stepNum);
            el.querySelector(".step-label").innerText = label;
            if (stepNum < stage) el.classList.add("completed");
            if (stepNum === stage) el.classList.add("active");
        });
    
        document.getElementById("trackOrderItems").innerHTML = latestOrder.items.map(item => {
            const reviewBtnHtml = stage === 4 ? `
                <button class="sakura-btn write-review-btn" data-title="${item.name}" style="padding: 4px 12px; font-size: 11px; margin-top: 8px; width: auto;">
                    ${t.writeReview}
                </button>` : '';

            return `
                <div class="order-item" style="align-items: flex-start;">
                    <img src="${item.image}" class="order-thumb">
                    <div class="order-details">
                        <div class="order-name">${item.name}</div>
                        <div class="order-meta">Qty: ${item.qty}</div>
                        ${reviewBtnHtml}
                    </div>
                    <div class="order-price">${formatPrice(item.price * item.qty)}</div>
                </div>`;
        }).join("");

        document.getElementById('cancelModalTitle').innerText = t.cancelTitle;
        document.getElementById('cancelModalBody').innerText = t.cancelConfirm;
        document.getElementById('keepOrderBtn').innerText = t.keepOrder;
        document.getElementById('confirmCancelBtn').innerText = t.cancelBtn;

        document.querySelectorAll('.write-review-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                QuickView.showByName(btn.dataset.title);
            });
        });
    
        document.getElementById("confirmCancelBtn").onclick = () => {
            const user = JSON.parse(localStorage.getItem("loggedInUser"));
            let allOrders = JSON.parse(localStorage.getItem("orders") || "[]");
            
            if (user && latestOrder) {
                const pointsToSubtract = Math.max(0, Math.floor(latestOrder.total - (latestOrder.shippingCost || 0)));
                let toastMsg = t.cancelSuccess;

                if (pointsToSubtract > 0) {
                    user.points = Math.max(0, (user.points || 0) - pointsToSubtract);
                    
                    const reversalTx = {
                        date: new Date().toISOString(),
                        amount: -pointsToSubtract,
                        reason: `Cancelled Order #${latestOrder.orderId}`,
                        reason_jp: `注文キャンセルによるポイント減算 (#${latestOrder.orderId})`
                    };
    
                    toastMsg += lang === 'jp' ? 
                        ` (${pointsToSubtract} ポイントが差し引かれました)` : 
                        ` (${pointsToSubtract} points forfeited)`;

                    user.pointsHistory = [...(Array.isArray(user.pointsHistory) ? user.pointsHistory : []), reversalTx];
                    
                    localStorage.setItem("loggedInUser", JSON.stringify(user));
                    
                    let users = JSON.parse(localStorage.getItem("users") || "[]");
                    users = users.map(u => u.email === user.email ? user : u);
                    localStorage.setItem("users", JSON.stringify(users));

                    window.dispatchEvent(new CustomEvent('shizuku_points_updated', { detail: user }));
                }

                const updatedOrders = allOrders.filter(o => o.orderId !== latestOrder.orderId);
                localStorage.setItem("orders", JSON.stringify(updatedOrders));
                
                cancelModal.hide();
                window.showSakuraToast(toastMsg, '🗑️');
                setTimeout(() => window.location.href = "profile.html", 1500);
            }
        };

        cancelBtn?.replaceWith(cancelBtn.cloneNode(true)); 
        const newCancelBtn = document.getElementById("cancelOrderBtn");
        newCancelBtn?.addEventListener("click", () => cancelModal.show());

        if (typeof QuickView !== 'undefined') QuickView.updateFooterUI();
    }

    document.getElementById("langToggle").addEventListener("click", () => {
        localStorage.setItem("language", localStorage.getItem("language") === "en" ? "jp" : "en");
        renderTracking();
    });
    
    document.addEventListener("DOMContentLoaded", renderTracking);

    document.getElementById("refreshBtn")?.addEventListener("click", function() {
        const btn = this;
        btn.classList.add("spinning");
        const lang = localStorage.getItem("language") || "en";

        setTimeout(() => {
            const user = JSON.parse(localStorage.getItem("loggedInUser"));
            let allOrders = JSON.parse(localStorage.getItem("orders") || "[]");
            
            if (user && allOrders.length > 0) {
                const userOrders = allOrders.filter(o => o.userEmail === user.email);
                const latest = userOrders.sort((a, b) => b.timestamp - a.timestamp)[0];
                
                if (latest) {
                    const globalIdx = allOrders.findIndex(o => o.orderId === latest.orderId);
                    allOrders[globalIdx].timestamp -= (24 * 60 * 60 * 1000); 
                    localStorage.setItem("orders", JSON.stringify(allOrders));
                }
            }

            renderTracking();
            btn.classList.remove("spinning");
            const msg = lang === 'jp' ? "注文状況を更新しました！" : "Tracking status updated!";
            window.showSakuraToast(msg, '↺');
        }, 1500);
    });
    </script>
</html>
